services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: bet
      POSTGRES_PASSWORD: bet
      POSTGRES_DB: bet
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bet']
      interval: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      retries: 10

volumes:
  pgdata:
