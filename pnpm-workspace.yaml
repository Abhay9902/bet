packages:
  - frontend
  - backend
  - packages/*

onlyBuiltDependencies:
  - '@prisma/engines'
  - prisma
  - esbuild
  - sharp
  - unrs-resolver

# Prisma 7.10 CLI pulls a vulnerable mysql2 (unused: we're on Postgres). Patch-level bump is safe.
overrides:
  mysql2: ^3.23.1

auditConfig:
  ignoreGhsas:
    # deepmerge-ts <8 inside Prisma's config loader: only ever merges our own static
    # prisma.config.ts, so the recursive-object DoS isn't reachable. Drop once Prisma upgrades it.
    - GHSA-ggr8-5vv4-36mx
